<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Student Result Management System</h1>

    <form action="StudentResultServlet" method="post">

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Register Number</label>
            <input type="text" name="regno" required>
        </div>

        <div class="form-group">
            <label>Java Mark</label>
            <input type="number" name="java" min="0" max="100" required>
        </div>

        <div class="form-group">
            <label>DBMS Mark</label>
            <input type="number" name="dbms" min="0" max="100" required>
        </div>

        <div class="form-group">
            <label>Web Technology Mark</label>
            <input type="number" name="web" min="0" max="100" required>
        </div>

        <input type="submit" value="View Result">

    </form>

</div>

</body>
</html>
